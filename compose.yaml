services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: festpass
      POSTGRES_DB: festpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend_net

  backend:
    image: suryansh12d/fest-backend:1.0.0
    environment:
      REGNO: "315"
      APP_VERSION: "1.0.0"
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - frontend_net

volumes:
  postgres_data:

networks:
  frontend_net:
  backend_net: